name: Validate evidence and implementation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    env:
      READOUT_REQUIRE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=xml
      - run: uv run python -m scripts.check_persistence
      - run: uv run python -m scripts.check_no_em_dash
      - run: uv run python -m scripts.check_published_numbers
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: node scripts/validate_palette.js --allow-mandated-palette-exception
