hypothesis: 'Retrospective reconstruction: moving the wait gate should improve seven-day
  retention by at least five percent relative, roughly one percentage point at the
  assumed planning baseline. This practical threshold and the rounds outlier policy
  were chosen with the public dataset already available; they are not historical pre-registration.'
