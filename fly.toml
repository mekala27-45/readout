primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  READOUT_ENV = "production"
  READOUT_CORS_ORIGINS = "https://mekala27-45.github.io"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/healthz"
